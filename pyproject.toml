[project]
name = "fincore"
version = "0.1.0"
description = "Educational double-entry banking simulation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.1,<4", "alembic>=1.13,<2", "pydantic[email]>=2.6,<3", "pydantic-settings>=2.2,<3", "PyJWT>=2.8,<3", "pwdlib[argon2]>=0.2,<1", "redis>=5,<7"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
[tool.ruff]
line-length=110

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
